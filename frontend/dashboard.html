<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusCycle | Dashboard</title>
  <link rel="stylesheet" href="/assets/styles/global.css" />
  <link rel="stylesheet" href="/assets/styles/theme.css" />
  <link rel="stylesheet" href="/assets/styles/components.css" />
  <link rel="stylesheet" href="/assets/styles/transitions.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar"></aside>
    <main class="main">
      <div class="topbar">
        <input class="search" type="search" placeholder="Quick search campus modules…" disabled style="opacity:0.6;" title="Use module pages for search" />
      </div>
      <div class="impact-banner">
        <h2>IMPACT DASHBOARD · Cycle More, Save More</h2>
        <p>Track your sustainability points, carbon savings, and recent campus activity across ReUse, Lost & Found, and Academic Hub.</p>
      </div>
      <section class="grid-4" id="metrics"></section>
      <section class="grid-2" style="margin-top:14px;">
        <div class="card panel"><h3>Recent Activity</h3><div id="recent-activity"></div></div>
        <div class="stack">
          <div class="card panel"><h3>Your Sustainability Impact</h3><div id="impact"></div></div>
          <div class="card panel">
            <h3>Quick Actions</h3>
            <div class="split-2">
              <a data-nav href="/reware.html" class="btn secondary" style="text-decoration:none;text-align:center;">Sell Item</a>
              <a data-nav href="/academic-hub.html" class="btn secondary" style="text-decoration:none;text-align:center;">Upload Notes</a>
              <a data-nav href="/lost-found.html" class="btn secondary" style="text-decoration:none;text-align:center;">Report Lost</a>
              <a data-nav href="/lost-found.html" class="btn secondary" style="text-decoration:none;text-align:center;">Report Found</a>
              <a data-nav href="/chat.html" class="btn secondary" style="text-decoration:none;text-align:center;">Open Chat</a>
              <a data-nav href="/leaderboard.html" class="btn secondary" style="text-decoration:none;text-align:center;">Leaderboard</a>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
  <a href="/chat.html" class="fab-chat" data-nav title="Chat">💬</a>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script src="/assets/js/shell.js"></script>
  <script src="/assets/js/notifications.js"></script>
  <script src="/assets/js/transitions.js"></script>
  <script src="/assets/js/pages/dashboard.js"></script>
</body>
</html>
