<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusCycle | Profile</title>
  <link rel="stylesheet" href="/assets/styles/global.css" />
  <link rel="stylesheet" href="/assets/styles/components.css" />
  <link rel="stylesheet" href="/assets/styles/transitions.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="brand-title">CampusCycle</div><div class="brand-sub">REWARE | SDG12</div>
      <div class="nav-group"><div class="nav-label">Overview</div><a class="nav-link" data-page="dashboard.html" data-nav href="/dashboard.html">Dashboard</a></div>
      <div class="nav-group"><div class="nav-label">Modules</div><a class="nav-link" data-page="reware.html" data-nav href="/reware.html">ReUse Marketplace</a><a class="nav-link" data-page="academic-hub.html" data-nav href="/academic-hub.html">Academic Hub</a><a class="nav-link" data-page="lost-found.html" data-nav href="/lost-found.html">Lost & Found</a></div>
      <div class="nav-group"><div class="nav-label">Account</div><a class="nav-link" data-page="profile.html" data-nav href="/profile.html">My Profile</a><a class="nav-link" href="#" id="logout-link">Logout</a></div>
    </aside>
    <main class="main">
      <div class="topbar"><div><h1>Student Profile</h1><div class="muted" id="institution-header"></div></div></div>
      <div class="card panel" style="max-width:760px;">
        <h3>Edit Profile</h3>
        <form id="profile-form" class="form-grid">
          <div><label>Email</label><input id="email" disabled /></div>
          <div><label>Reg No</label><input id="regNo" disabled /></div>
          <div><label>Name</label><input id="name" name="name" required /></div>
          <div><label>Department</label><input id="department" name="department" required /></div>
          <div><label>Year</label><input id="year" name="year" required /></div>
          <div><label>Semester</label><input id="sem" name="sem" required /></div>
          <div style="grid-column:1/-1;display:flex;justify-content:flex-end;"><button class="btn" type="submit">Save Profile</button></div>
        </form>
        <p id="profile-msg"></p>
      </div>
    </main>
  </div>
  <script src="/assets/js/api.js"></script><script src="/assets/js/auth.js"></script><script src="/assets/js/layout.js"></script><script src="/assets/js/transitions.js"></script><script src="/assets/js/pages/profile.js"></script>
</body>
</html>
