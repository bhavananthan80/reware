<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusCycle | Profile</title>
  <link rel="stylesheet" href="/assets/styles/global.css" />
  <link rel="stylesheet" href="/assets/styles/theme.css" />
  <link rel="stylesheet" href="/assets/styles/components.css" />
  <link rel="stylesheet" href="/assets/styles/transitions.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar"></aside>
    <main class="main">
      <div class="topbar">
        <div><h1>My Profile</h1><p class="muted" style="margin:4px 0 0;font-size:13px;">Manage your campus account</p></div>
      </div>
      <div class="impact-banner">
        <h2>YOUR CAMPUS IDENTITY</h2>
        <p>Keep your phone number updated for meet coordination and SMS alerts when someone accepts your request.</p>
      </div>
      <div class="card panel" style="max-width:800px;">
        <div class="profile-hero" id="profile-hero"></div>
        <h3>Edit Profile</h3>
        <form id="profile-form" class="form-grid">
          <div><label>Email</label><input id="email" disabled /></div>
          <div><label>Reg No</label><input id="regNo" disabled /></div>
          <div><label>Phone</label><input id="phone" name="phone" type="tel" required /></div>
          <div><label>Name</label><input id="name" name="name" required /></div>
          <div><label>Department</label><input id="department" name="department" required /></div>
          <div><label>Year</label><input id="year" name="year" required /></div>
          <div><label>Semester</label><input id="sem" name="sem" required /></div>
          <div style="grid-column:1/-1;display:flex;justify-content:flex-end;gap:10px;">
            <a class="btn secondary" data-nav href="/leaderboard.html">View points</a>
            <button class="btn" type="submit">Save Profile</button>
          </div>
        </form>
        <p id="profile-msg"></p>
      </div>
    </main>
  </div>
  <a href="/chat.html" class="fab-chat" data-nav title="Chat">💬</a>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script src="/assets/js/shell.js"></script>
  <script src="/assets/js/notifications.js"></script>
  <script src="/assets/js/transitions.js"></script>
  <script src="/assets/js/pages/profile.js"></script>
</body>
</html>
